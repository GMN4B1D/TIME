<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Ultimate Timer Studio</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        :root {
            --timer-color: #38bdf8;
        }

        body {
            background: radial-gradient(circle at center, #1e1b4b, #0f172a);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            transition: background 0.6s ease;
        }

        /* Advanced Glassmorphism Dashboard */
        .setup-container {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            padding: 35px;
            border-radius: 24px;
            width: 92%;
            max-width: 550px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.7);
            z-index: 10;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            max-height: 90vh;
            overflow-y: auto;
        }

        .setup-container::-webkit-scrollbar {
            width: 6px;
        }
        .setup-container::-webkit-scrollbar-thumb {
            background: rgba(255,255,255,0.2);
            border-radius: 3px;
        }

        .setup-container.hidden {
            opacity: 0;
            pointer-events: none;
            transform: scale(0.95);
            display: none;
        }

        h1 {
            font-size: 24px;
            margin-bottom: 25px;
            text-align: center;
            font-family: 'Orbitron', sans-serif;
            letter-spacing: 3px;
            background: linear-gradient(90deg, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .input-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-size: 13px;
            margin-bottom: 6px;
            color: #94a3b8;
            font-weight: 500;
        }

        input, select {
            width: 100%;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 10px;
            color: #fff;
            font-size: 15px;
            outline: none;
            transition: border-color 0.3s;
        }

        input:focus, select:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.2);
        }

        input[type="color"] {
            padding: 5px;
            height: 45px;
            cursor: pointer;
        }

        .row {
            display: flex;
            gap: 12px;
        }

        .row .input-group {
            flex: 1;
        }

        .btn-primary {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 15px;
            box-shadow: 0 10px 20px rgba(59, 130, 246, 0.4);
            transition: all 0.3s ease;
        }

        .btn-primary:hover {
            background: linear-gradient(135deg, #2563eb, #1e40af);
            transform: translateY(-2px);
            box-shadow: 0 15px 25px rgba(59, 130, 246, 0.6);
        }

        /* Fullscreen Timer View */
        .timer-view {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 5;
        }

        .timer-display {
            font-family: 'Orbitron', sans-serif;
            font-size: 10vw;
            font-weight: 900;
            text-align: center;
            letter-spacing: 6px;
            user-select: none;
            color: var(--timer-color);
            transition: all 0.3s ease;
        }

        /* 20 Different Timer Animations & Themes */
        .anim-1 .timer-display { text-shadow: 0 0 20px var(--timer-color), 0 0 40px var(--timer-color); animation: pulseNeon 2s infinite alternate; }
        .anim-2 .timer-display { font-family: 'Courier New', monospace; color: #22c55e; text-shadow: 0 0 10px #22c55e; animation: matrixFlicker 1.5s infinite; }
        .anim-3 .timer-display { animation: floatAnim 3s ease-in-out infinite; }
        .anim-4 .timer-display { text-shadow: 5px 5px 0px rgba(0,0,0,0.8), 0 0 25px var(--timer-color); transform: skew(-5deg); }
        .anim-5 .timer-display { animation: zoomBreath 4s ease-in-out infinite; }
        .anim-6 .timer-display { text-shadow: 0 0 15px #facc15, 0 0 30px #f59e0b; animation: fireGlow 1.2s infinite alternate; }
        .anim-7 .timer-display { background: linear-gradient(45deg, #ff007f, #7928ca, #38bdf8); -webkit-background-clip: text; -webkit-text-fill-color: transparent; animation: rgbShift 5s linear infinite; background-size: 300%; }
        .anim-8 .timer-display { animation: glitchEffect 1s infinite; }
        .anim-9 .timer-display { text-shadow: 2px 2px 0px #fff, 6px 6px 0px var(--timer-color); }
        .anim-10 .timer-display { animation: heartbeat 1s infinite; }
        .anim-11 .timer-display { filter: drop-shadow(0 0 15px var(--timer-color)); transform: rotate(-2deg); }
        .anim-12 .timer-display { letter-spacing: 12px; font-weight: 400; opacity: 0.9; }
        .anim-13 .timer-display { border: 4px dashed var(--timer-color); padding: 20px 40px; border-radius: 20px; background: rgba(0,0,0,0.3); }
        .anim-14 .timer-display { text-shadow: 0 0 30px #00ffff, inset 0 0 15px #00ffff; }
        .anim-15 .timer-display { animation: shakeAnim 0.8s infinite; }
        .anim-16 .timer-display { background: linear-gradient(to top, #ff416c, #ff4b2b); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .anim-17 .timer-display { font-family: 'Poppins', sans-serif; font-weight: 300; letter-spacing: 2px; }
        .anim-18 .timer-display { text-shadow: 0 5px 15px rgba(0,0,0,0.5), 0 -5px 15px var(--timer-color); }
        .anim-19 .timer-display { animation: rotateSlight 6s ease-in-out infinite alternate; }
        .anim-20 .timer-display { text-shadow: 0 0 5px #fff, 0 0 10px #fff, 0 0 20px var(--timer-color), 0 0 40px var(--timer-color); }

        /* Keyframes for Animations */
        @keyframes pulseNeon { 0% { transform: scale(1); filter: brightness(1); } 100% { transform: scale(1.03); filter: brightness(1.25); } }
        @keyframes matrixFlicker { 0%, 100% { opacity: 1; } 50% { opacity: 0.85; text-shadow: 0 0 20px #22c55e; } }
        @keyframes floatAnim { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }
        @keyframes zoomBreath { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.06); } }
        @keyframes fireGlow { 0% { text-shadow: 0 0 10px #facc15; } 100% { text-shadow: 0 0 30px #ef4444, 0 0 50px #f97316; } }
        @keyframes rgbShift { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
        @keyframes glitchEffect { 0% { transform: translate(0) } 20% { transform: translate(-3px, 3px) } 40% { transform: translate(-3px, -3px) } 60% { transform: translate(3px, 3px) } 80% { transform: translate(3px, -3px) } 100% { transform: translate(0) } }
        @keyframes heartbeat { 0%, 100% { transform: scale(1); } 15%, 45% { transform: scale(1.05); } }
        @keyframes shakeAnim { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-2px); } 75% { transform: translateX(2px); } }
        @keyframes rotateSlight { 0% { transform: rotate(-3deg); } 100% { transform: rotate(3deg); } }

        /* Controls Overlay (Hidden by default, shown on screen click) */
        .controls-overlay {
            position: absolute;
            bottom: 40px;
            display: flex;
            gap: 15px;
            background: rgba(15, 23, 42, 0.85);
            padding: 16px 32px;
            border-radius: 40px;
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease, transform 0.4s ease;
            transform: translateY(20px);
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
        }

        .controls-overlay.visible {
            opacity: 1;
            pointer-events: auto;
            transform: translateY(0);
        }

        .control-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: white;
            padding: 10px 22px;
            border-radius: 25px;
            font-size: 14px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .control-btn:hover {
            background: rgba(255, 255, 255, 0.25);
            transform: scale(1.05);
        }

        .control-btn.danger {
            background: rgba(239, 68, 68, 0.3);
            border-color: rgba(239, 68, 68, 0.4);
        }
        .control-btn.danger:hover {
            background: rgba(239, 68, 68, 0.6);
        }

        .hint-text {
            position: absolute;
            bottom: 15px;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.4);
            opacity: 0;
            transition: opacity 0.4s;
        }
        .hint-text.visible {
            opacity: 1;
        }
    </style>
</head>
<body>

    <!-- Setup Dashboard -->
    <div class="setup-container" id="setupContainer">
        <h1>ADVANCED TIMER STUDIO</h1>
        
        <div class="input-group">
            <label>Timer Mode</label>
            <select id="timerMode">
                <option value="countdown">Countdown (Ulta Timer)</option>
                <option value="countup">Count-up (1 theke shuru)</option>
            </select>
        </div>

        <div class="input-group" id="durationInputsBox">
            <label>Set Duration (HH : MM : SS)</label>
            <div class="row">
                <input type="number" id="inputHour" value="0" min="0" placeholder="Hours">
                <input type="number" id="inputMin" value="5" min="0" placeholder="Minutes">
                <input type="number" id="inputSec" value="0" min="0" max="59" placeholder="Seconds">
            </div>
        </div>

        <div class="input-group">
            <label>Timer Animation & Theme (20 Options)</label>
            <select id="animSelect">
                <option value="anim-1">1. Neon Electric Blue Pulse</option>
                <option value="anim-2">2. Matrix Terminal Green</option>
                <option value="anim-3">3. Floating Wave Levitation</option>
                <option value="anim-4">4. Cyberpunk Angular 3D</option>
                <option value="anim-5">5. Breathing Zoom Glow</option>
                <option value="anim-6">6. Burning Fire Flame</option>
                <option value="anim-7">7. RGB Spectrum Rainbow Flow</option>
                <option value="anim-8">8. Cyber Glitch Flicker</option>
                <option value="anim-9">9. Retro Double Shadow</option>
                <option value="anim-10">10. Heartbeat Pulse</option>
                <option value="anim-11">11. Hologram Drop-Shadow Tilt</option>
                <option value="anim-12">12. Wide Cinematic Letter-spacing</option>
                <option value="anim-13">13. Cyber Boxed Border Frame</option>
                <option value="anim-14">14. Aqua Cyan Sci-Fi Glow</option>
                <option value="anim-15">15. High-Energy Shake Vibe</option>
                <option value="anim-16">16. Sunset Gradient Fade</option>
                <option value="anim-17">17. Clean Minimalist Modern</option>
                <option value="anim-18">18. Dual-Tone Depth Shadow</option>
                <option value="anim-19">19. Subtle Orbit Tilt</option>
                <option value="anim-20">20. Supernova Intense Glow</option>
            </select>
        </div>

        <div class="row">
            <div class="input-group">
                <label>Background Color</label>
                <input type="color" id="bgColor" value="#0f172a">
            </div>
            <div class="input-group">
                <label>Timer Text Color</label>
                <input type="color" id="timerTextColor" value="#38bdf8">
            </div>
        </div>

        <div class="input-group">
            <label>Sound Effect</label>
            <select id="soundOption">
                <option value="beep">Digital Beep</option>
                <option value="chime">Soft Chime</option>
                <option value="none">Mute / None</option>
            </select>
        </div>

        <button class="btn-primary" id="startBtn">Launch Fullscreen Timer</button>
    </div>

    <!-- Timer View -->
    <div class="timer-view anim-1" id="timerView">
        <div class="timer-display" id="timerDisplay">00:05:00</div>
        
        <div class="controls-overlay" id="controlsOverlay">
            <button class="control-btn" id="pauseResumeBtn">Pause</button>
            <button class="control-btn" id="resetBtn">Reset</button>
            <button class="control-btn danger" id="exitBtn">Exit Fullscreen</button>
        </div>
        <div class="hint-text" id="hintText">Click anywhere to show/hide controls</div>
    </div>

    <script>
        const setupContainer = document.getElementById('setupContainer');
        const timerView = document.getElementById('timerView');
        const timerDisplay = document.getElementById('timerDisplay');
        const startBtn = document.getElementById('startBtn');
        const timerMode = document.getElementById('timerMode');
        const durationInputsBox = document.getElementById('durationInputsBox');
        const inputHour = document.getElementById('inputHour');
        const inputMin = document.getElementById('inputMin');
        const inputSec = document.getElementById('inputSec');
        const animSelect = document.getElementById('animSelect');
        const bgColor = document.getElementById('bgColor');
        const timerTextColor = document.getElementById('timerTextColor');
        const soundOption = document.getElementById('soundOption');
        
        const controlsOverlay = document.getElementById('controlsOverlay');
        const pauseResumeBtn = document.getElementById('pauseResumeBtn');
        const resetBtn = document.getElementById('resetBtn');
        const exitBtn = document.getElementById('exitBtn');
        const hintText = document.getElementById('hintText');

        let timerInterval = null;
        let totalSeconds = 0;
        let remainingSeconds = 0;
        let isRunning = false;
        let isPaused = false;
        let inactivityTimer = null;

        // Toggle inputs box based on mode
        timerMode.addEventListener('change', () => {
            if (timerMode.value === 'countup') {
                durationInputsBox.style.display = 'none';
            } else {
                durationInputsBox.style.display = 'block';
            }
        });

        // Web Audio API Sound Generator
        function playSound(type) {
            if (type === 'none') return;
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                
                osc.connect(gain);
                gain.connect(audioCtx.destination);

                if (type === 'beep') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(880, audioCtx.currentTime);
                    gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.15);
                } else if (type === 'chime') {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(523.25, audioCtx.currentTime);
                    gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.8);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.8);
                }
            } catch (e) {
                console.log("Audio error:", e);
            }
        }

        startBtn.addEventListener('click', () => {
            const mode = timerMode.value;
            if (mode === 'countdown') {
                const hrs = parseInt(inputHour.value) || 0;
                const mins = parseInt(inputMin.value) || 0;
                const secs = parseInt(inputSec.value) || 0;
                totalSeconds = (hrs * 3600) + (mins * 60) + secs;
                if (totalSeconds <= 0) {
                    alert('Please enter a valid time greater than 0');
                    return;
                }
                remainingSeconds = totalSeconds;
            } else {
                remainingSeconds = 0;
            }

            // Apply Animation & Custom Colors
            timerView.className = `timer-view ${animSelect.value}`;
            document.body.style.background = bgColor.value;
            document.documentElement.style.setProperty('--timer-color', timerTextColor.value);

            setupContainer.classList.add('hidden');
            
            // Fullscreen trigger
            if (document.documentElement.requestFullscreen) {
                document.documentElement.requestFullscreen().catch(err => {
                    console.log("Fullscreen error:", err);
                });
            }

            updateDisplay();
            startTimer();
            showHintAndControlsTemporarily();
        });

        function startTimer() {
            isRunning = true;
            isPaused = false;
            pauseResumeBtn.textContent = "Pause";

            timerInterval = setInterval(() => {
                const mode = timerMode.value;
                if (mode === 'countdown') {
                    if (remainingSeconds > 0) {
                        remainingSeconds--;
                        updateDisplay();
                        if (remainingSeconds === 0) {
                            playSound(soundOption.value);
                            clearInterval(timerInterval);
                            isRunning = false;
                            pauseResumeBtn.textContent = "Finished";
                        }
                    }
                } else {
                    remainingSeconds++;
                    updateDisplay();
                }
            }, 1000);
        }

        function updateDisplay() {
            const hrs = Math.floor(Math.abs(remainingSeconds) / 3600);
            const mins = Math.floor((Math.abs(remainingSeconds) % 3600) / 60);
            const secs = Math.abs(remainingSeconds) % 60;
            
            const formatted = `${String(hrs).padStart(2, '0')}:${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
            timerDisplay.textContent = formatted;
        }

        pauseResumeBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            if (!isRunning && !isPaused) return;

            if (isPaused) {
                startTimer();
            } else {
                clearInterval(timerInterval);
                isPaused = true;
                isRunning = false;
                pauseResumeBtn.textContent = "Resume";
            }
        });

        resetBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            clearInterval(timerInterval);
            if (timerMode.value === 'countdown') {
                const hrs = parseInt(inputHour.value) || 0;
                const mins = parseInt(inputMin.value) || 15;
                const secs = parseInt(inputSec.value) || 0;
                remainingSeconds = (hrs * 3600) + (mins * 60) + secs;
            } else {
                remainingSeconds = 0;
            }
            updateDisplay();
            startTimer();
        });

        exitBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            stopEverything();
        });

        function stopEverything() {
            clearInterval(timerInterval);
            isRunning = false;
            isPaused = false;
            if (document.fullscreenElement) {
                document.exitFullscreen().catch(() => {});
            }
            timerView.className = "timer-view anim-1";
            document.body.style.background = "radial-gradient(circle at center, #1e1b4b, #0f172a)";
            setupContainer.classList.remove('hidden');
            controlsOverlay.classList.remove('visible');
            hintText.classList.remove('visible');
        }

        document.addEventListener('fullscreenchange', () => {
            if (!document.fullscreenElement) {
                stopEverything();
            }
        });

        timerView.addEventListener('click', () => {
            showHintAndControlsTemporarily();
        });

        function showHintAndControlsTemporarily() {
            controlsOverlay.classList.add('visible');
            hintText.classList.add('visible');

            clearTimeout(inactivityTimer);
            inactivityTimer = setTimeout(() => {
                controlsOverlay.classList.remove('visible');
                hintText.classList.remove('visible');
            }, 3500);
        }
    </script>
</body>
</html>
